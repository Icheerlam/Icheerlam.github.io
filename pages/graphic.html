<html lang="zh-CN" data-title-zh="平面与 3D 设计" data-title-en="Graphic & 3D Design">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic / 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --ak-bg-main:#050505; --ak-bg-panel:rgba(18,18,20,0.92); --ak-text-main:#ffffff; --ak-text-muted:#7a7a7a; --ak-accent-info:#00d8ff; --ak-accent-warn:#f5a623; --ak-border:#2a2a2a; }
        body.light-mode { --ak-bg-main:#e5e7eb; --ak-bg-panel:rgba(255,255,255,0.95); --ak-text-main:#111; --ak-border:#ccc; }
        * { box-sizing:border-box; margin:0; padding:0; }
        html { scroll-behavior: smooth; }
        body { background:var(--ak-bg-main); color:var(--ak-text-main); font-family:'Space Grotesk',sans-serif; line-height:1.6; overflow-x:hidden; counter-reset:gallery-counter; transition:background .4s,color .4s; }
        @keyframes fadeUp { 0%{opacity:0;transform:translateY(20px);} 100%{opacity:1;transform:translateY(0);} }

        nav { position:fixed; top:0; width:100%; padding:15px 5vw; display:flex; justify-content:space-between; align-items:center; background:var(--ak-bg-panel); border-bottom:1px solid var(--ak-border); z-index:1000; backdrop-filter:blur(10px); transition:.4s; }
        .nav-logo { font:800 1rem 'Space Mono'; letter-spacing:2px; color:var(--ak-text-main); text-decoration:none; border:1px solid var(--ak-accent-info); padding:5px 12px; cursor:pointer; }
        .nav-right { display:flex; align-items:center; gap:30px; }
        .nav-links { display:flex; gap:25px; font:.85rem 'Space Mono'; }
        .nav-links a { color:var(--ak-text-main); text-decoration:none; font-weight:700; text-transform:uppercase; transition:.3s; cursor:pointer; }
        .nav-links a:hover, .nav-links a.active { color:var(--ak-accent-info); text-shadow:0 0 8px var(--ak-accent-info); }
        .nav-home-btn { padding:6px 14px; background:transparent; color:var(--ak-accent-warn); border:1px solid var(--ak-accent-warn); font:700 .85rem 'Space Mono'; text-decoration:none; transition:.3s; cursor:pointer; }
        .nav-home-btn:hover { background:var(--ak-accent-warn); color:#000; }

        .audio-toggle-btn { position:fixed; top:80px; left:5vw; background:rgba(10,10,12,.8); backdrop-filter:blur(5px); color:var(--ak-accent-info); border:1px solid var(--ak-accent-info); padding:6px 12px; font:bold .75rem 'Space Mono'; cursor:pointer; z-index:999; transition:.3s; border-radius:2px; width:170px; text-align:center; letter-spacing:1px; }
        .audio-toggle-btn:hover { background:var(--ak-accent-info); color:#000; box-shadow:0 0 10px var(--ak-accent-info); }
        .audio-toggle-btn.muted { color:var(--ak-text-muted); border-color:var(--ak-text-muted); }
        .volume-panel { position:fixed; top:125px; left:5vw; background:rgba(10,10,12,.85); backdrop-filter:blur(5px); border:1px solid var(--ak-border); border-top:3px solid var(--ak-border); padding:15px; width:170px; z-index:998; transition:.3s opacity,.3s border-color; opacity:.5; overflow:hidden; }
        .volume-panel:hover { opacity:1; border-color:var(--ak-accent-info); box-shadow:0 0 15px rgba(0,216,255,.1); }
        .vol-header { font:bold .65rem 'Space Mono'; color:var(--ak-accent-info); padding-bottom:5px; text-transform:uppercase; cursor:pointer; display:flex; justify-content:space-between; align-items:center; border-bottom:1px dashed var(--ak-border); transition:.2s color; }
        .vol-header:hover { color:var(--ak-text-main); }
        .vol-content { display:flex; flex-direction:column; gap:12px; transition:max-height .3s,opacity .3s,margin-top .3s; max-height:200px; opacity:1; margin-top:10px; }
        .volume-panel.collapsed .vol-content { max-height:0; opacity:0; margin-top:0; pointer-events:none; }
        .volume-panel.collapsed .vol-header { border-bottom:none; padding-bottom:0; }
        .vol-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .vol-row label { font:.65rem 'Space Mono'; color:var(--ak-text-muted); width:40px; text-align:left; }
        .vol-slider { -webkit-appearance:none; width:100%; height:3px; background:var(--ak-border); outline:none; border-radius:2px; }
        .vol-slider::-webkit-slider-thumb { -webkit-appearance:none; width:8px; height:12px; background:var(--ak-accent-info); cursor:pointer; border-radius:1px; }
        .vol-slider::-webkit-slider-thumb:hover { background:var(--ak-accent-warn); }

        .theme-toggle-btn { position:fixed; bottom:30px; right:30px; background:var(--ak-bg-main); color:var(--ak-text-muted); border:1px solid var(--ak-border); padding:12px 16px; font:700 .8rem 'Space Mono'; cursor:pointer; z-index:1500; transition:.3s; box-shadow:0 4px 10px rgba(0,0,0,.5); }
        .theme-toggle-btn:hover { border-color:var(--ak-accent-info); color:var(--ak-accent-info); transform:translateY(-3px); }
        body.lang-en [data-lang="zh"] { display: none !important; }
        body:not(.lang-en) [data-lang="en"] { display: none !important; }

        .page-header { text-align:center; margin:140px auto 30px; animation:fadeUp .6s forwards; position:relative; z-index:10; }
        .page-header h1 { font:800 2.2rem 'Space Mono'; color:var(--ak-accent-info); margin-bottom:6px; }

        /* ====== 分区标题 ====== */
        .section-divider { max-width:1600px; margin:40px auto 30px; padding:0 5vw; position:relative; z-index:10; display:flex; align-items:center; gap:20px; }
        .section-divider::after { content:''; flex:1; height:1px; background:var(--ak-border); }
        .section-divider h2 { font:800 1.4rem 'Space Mono'; color:var(--ak-accent-warn); text-transform:uppercase; white-space:nowrap; }
        .section-divider h2::before { content:'/> '; color:var(--ak-accent-info); }

        /* ====== 平面设计 · 瀑布流 ====== */
        .masonry-gallery { max-width:1600px; margin:0 auto; padding:0 5vw 40px; column-count:4; column-gap:24px; position:relative; z-index:10; }
        .masonry-item { break-inside:avoid; margin-bottom:24px; background:var(--ak-bg-panel); backdrop-filter:blur(10px); border:1px solid var(--ak-border); border-top:3px solid var(--ak-border); padding:10px; opacity:0; animation:fadeUp .6s forwards; transition:.4s; position:relative; cursor:pointer; }
        .masonry-item::before { counter-increment:gallery-counter; content:"[IMG-" counter(gallery-counter) "]"; position:absolute; top:20px; left:20px; font:bold .65rem 'Space Mono'; color:#000; background:var(--ak-text-muted); padding:2px 8px; z-index:10; transition:.3s; opacity:0; }
        .masonry-item:hover { border-color:var(--ak-accent-info); transform:translateY(-4px); box-shadow:0 10px 30px rgba(0,216,255,.1); }
        .masonry-item:hover::before { opacity:1; background:var(--ak-accent-info); }
        .masonry-item img { width:100%; display:block; transition:.4s; cursor:zoom-in; }
        .masonry-item:hover img { transform:scale(1.02); }
        .portfolio-title { margin:6px 2px 0; color:var(--ak-text-main); font:700 .75rem 'Space Mono'; }
        .video-group-content { display:flex; flex-direction:column; }
        .video-group-media { display:flex; gap:12px; width:100%; min-height:220px; }
        .video-group-pane { min-width:0; overflow:hidden; border-radius:2px; }
        .video-group-pane video { width:100%; height:100%; object-fit:cover; display:block; }
        .media-error { padding:18px 10px; border:1px dashed var(--ak-accent-warn); color:var(--ak-accent-warn); font:700 .7rem 'Space Mono'; text-align:center; }
        .portfolio-drag-handle { position:absolute; top:8px; right:8px; color:var(--ak-accent-info); cursor:grab; user-select:none; }
        .portfolio-manage-controls { display:flex; gap:4px; margin-top:10px; }
        .portfolio-manage-controls button { padding:2px 6px; background:transparent; color:var(--ak-text-muted); border:1px solid var(--ak-border); cursor:pointer; font: .65rem 'Space Mono'; }
        .portfolio-manage-controls button:hover { color:var(--ak-accent-info); border-color:var(--ak-accent-info); }

        /* ====== 3D · 网格卡片 ====== */
        .gallery-3d { max-width:1400px; margin:0 auto; padding:0 5vw 60px; display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:30px; position:relative; z-index:10; }
        .card-3d { background:var(--ak-bg-panel); backdrop-filter:blur(10px); border:1px solid var(--ak-border); border-top:3px solid var(--ak-border); padding:20px; position:relative; opacity:0; animation:fadeUp .6s forwards; transition:.3s; display:flex; flex-direction:column; }
        .card-3d:hover { border-color:var(--ak-accent-info); transform:translateY(-5px); box-shadow:0 15px 40px rgba(0,216,255,.1); }
        .card-3d .img-box { width:100%; border-radius:2px; overflow:hidden; background:#000; border:1px solid var(--ak-border); }
        .card-3d img, .card-3d video { width:100%; display:block; transition:.6s ease; }
        .card-3d img { cursor:zoom-in; }
        .card-3d:hover img, .card-3d:hover video { transform:scale(1.05); }
        .card-3d .c3d-title { margin-top:16px; font:800 .9rem 'Space Mono'; color:var(--ak-text-main); display:flex; align-items:center; gap:8px; text-transform:uppercase; }
        .card-3d .c3d-title::before { content:'/>'; color:var(--ak-accent-info); }

        .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:3000; display:none; justify-content:center; align-items:center; }
        .lightbox.active { display:flex; }
        .lightbox img { max-width:90vw; max-height:90vh; border:2px solid var(--ak-accent-info); object-fit:contain; }
        .lightbox-close { position:absolute; top:25px; right:40px; color:#fff; cursor:pointer; font:bold 1.2rem 'Space Mono'; border:1px solid #fff; padding:6px 12px; transition:.3s; }
        .lightbox-close:hover { background:#fff; color:#000; }

        .back-nav { text-align:center; margin-bottom:80px; position:relative; z-index:10; }
        .btn-back { display:inline-block; padding:12px 30px; border:1px solid var(--ak-border); color:var(--ak-text-main); font:700 1rem 'Space Mono'; text-decoration:none; transition:.3s; cursor:pointer; }
        .btn-back:hover { background:var(--ak-accent-info); color:#000; border-color:var(--ak-accent-info); }
        footer { position:relative; text-align:center; padding:40px; color:var(--ak-text-muted); font:.75rem 'Space Mono'; text-transform:uppercase; border-top:1px solid var(--ak-border); z-index:10; }
        footer::before, footer::after { content:''; position:absolute; top:-1px; width:20px; height:4px; background:var(--ak-accent-info); }
        footer::before { left:0; } footer::after { right:0; }

        @media (max-width:1200px) { .masonry-gallery { column-count:3; } }
        @media (max-width:900px) { .masonry-gallery { column-count:2; } .gallery-3d { grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); } .nav-links { display:none; } }
        @media (max-width:768px) {
            .audio-toggle-btn { top:auto; bottom:20px; left:20px; z-index:2000; width:120px; padding:10px; }
            .volume-panel { top:auto; bottom:70px; left:20px; transform:scale(.85); transform-origin:bottom left; z-index:1999; }
            .theme-toggle-btn { bottom:20px; right:20px; z-index:2000; }
        }
        @media (max-width:600px) { .masonry-gallery { column-count:1; } }
    </style>

    <script>
        /* RETURN 按钮环境适配：服务器跳转服务器主页，本地跳转 index.html */
        (function(){
            const homeUrl = window.location.hostname === '106.53.112.240' ? 'http://106.53.112.240/' : '../index.html';
            document.querySelectorAll('.nav-home-btn, .btn-back').forEach(el => {
                if (/\[ RETURN \]/.test(el.textContent)) el.href = homeUrl;
            });
        })();

        document.addEventListener('DOMContentLoaded', () => {
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lightbox-img');
            const toggleLB = (src = '') => { lbImg.src = src; lb.classList.toggle('active'); document.body.style.overflow = src ? 'hidden' : ''; };
            lb.onclick = e => { if (e.target !== lbImg) toggleLB(); };

            const bgmAudio = document.getElementById('bgmAudio');
            const hoverSound = document.getElementById('hoverSound');
            const clickSound = document.getElementById('clickSound');
            const specialSound = document.getElementById('specialSound');
            const audioToggle = document.getElementById('audioToggle');
            const bgmVol = document.getElementById('bgmVol');
            const hoverVol = document.getElementById('hoverVol');
            const clickVol = document.getElementById('clickVol');
            const specialVol = document.getElementById('specialVol');
            const volHeader = document.getElementById('volHeader');
            const volumePanel = document.getElementById('volumePanel');
            const volIcon = document.getElementById('volIcon');
            let isAudioEnabled = false;
            window.isAudioEnabled = false;
            window.clickSound = clickSound;
            window.clickVol = clickVol;

            bgmVol.addEventListener('input', e => { if(isAudioEnabled) bgmAudio.volume = e.target.value; });
            audioToggle.addEventListener('click', () => {
                isAudioEnabled = !isAudioEnabled;
                window.isAudioEnabled = isAudioEnabled;
                if(isAudioEnabled) {
                    audioToggle.innerHTML = '[ AUDIO: ON ]'; audioToggle.classList.remove('muted');
                    bgmAudio.volume = bgmVol.value; bgmAudio.play().catch(() => {});
                    playSound(clickSound, clickVol);
                } else {
                    audioToggle.innerHTML = '[ AUDIO: OFF ]'; audioToggle.classList.add('muted'); bgmAudio.pause();
                }
            });
            volHeader.addEventListener('click', () => {
                volumePanel.classList.toggle('collapsed');
                volIcon.textContent = volumePanel.classList.contains('collapsed') ? '[+]' : '[-]';
                playSound(clickSound, clickVol);
            });
            function playSound(audio, volRef) {
                if(!isAudioEnabled) return;
                audio.currentTime = 0; audio.volume = volRef.value;
                audio.play().catch(() => {});
            }

            function bindInteractables() {
              const interactables = document.querySelectorAll('.interactable, button, a, .masonry-item, .card-3d, .lightbox-close');
              interactables.forEach(el => {
                if (el.dataset.soundBound === 'true') return;
                el.dataset.soundBound = 'true';
                el.addEventListener('mouseenter', () => playSound(hoverSound, hoverVol));
                if (el.tagName.toLowerCase() === 'button' || el.tagName.toLowerCase() === 'a' || el.classList.contains('lightbox-close')) {
                    if(!el.classList.contains('vol-slider') && el.id !== 'volHeader') {
                        if(el.classList.contains('nav-logo')) {
                            el.addEventListener('click', (e) => { e.preventDefault(); playSound(specialSound, specialVol); });
                        } else {
                            el.addEventListener('click', () => playSound(clickSound, clickVol));
                        }
                    }
                }
              });
            }
            bindInteractables();

            document.addEventListener('portfolio:rendered', bindInteractables);

            const status = document.createElement('p');
            status.className = 'portfolio-load-status';
            status.hidden = true;
            status.style.cssText = 'max-width:1600px;margin:0 auto 30px;padding:12px 5vw;color:var(--ak-accent-warn);font-family:"Space Mono",monospace;';
            document.querySelector('.page-header').after(status);

            function showLoadError(error) {
                status.hidden = false;
                status.setAttribute('role', 'status');
                status.textContent = '作品清单暂时无法加载 / Portfolio manifest unavailable';
                status.title = error && error.message ? error.message : '';
            }

            const renderer = window.GraphicPortfolioRenderer.createPortfolioRenderer({
                document,
                getLanguage: () => document.documentElement.getAttribute('data-current-lang') || 'zh',
                onOpenMedia: ({ src }) => {
                    toggleLB(src);
                    if (window.isAudioEnabled && window.clickSound) {
                        window.clickSound.currentTime = 0;
                        window.clickSound.volume = window.clickVol.value;
                        window.clickSound.play().catch(() => {});
                    }
                },
            });
            window.graphicPortfolioRenderer = renderer;

            async function loadPortfolio() {
                try {
                    const response = await fetch('../data/graphic-works.json');
                    if (!response || (typeof response.ok === 'boolean' && !response.ok)) throw new Error(`HTTP ${response && response.status}`);
                    const manifest = await response.json();
                    const store = window.GraphicPortfolioStore.createPortfolioStore(manifest.works);
                    window.graphicPortfolioStore = store;
                    renderer.render(store.items(), { editing: false });
                    status.hidden = true;
                } catch (error) {
                    showLoadError(error);
                }
            }
            loadPortfolio();
        });
    </script>
    <script src="../assets/js/language.js"></script>
</body>
</html>
