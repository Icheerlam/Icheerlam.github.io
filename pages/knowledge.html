        .knowledge-card { background:var(--ak-bg-panel); backdrop-filter:blur(10px); border:1px solid var(--ak-border); padding:28px; opacity:0; animation:fadeUp 0.5s forwards; transition:0.3s; position:relative; overflow:hidden; display:flex; flex-direction:column; }

        .k-card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; gap:8px; }

        .modal { background:var(--ak-bg-panel); border:1px solid var(--ak-border); border-top:3px solid var(--ak-accent-warn); padding:36px; width:90%; max-width:560px; max-height:90vh; overflow-y:auto; backdrop-filter:blur(20px); }

        const defaultData = [
            { id:1, cat:'github', title:'Claude Code', link:'https://github.com/anthropics/claude-code', desc:'Anthropic 官方 CLI 工具，在终端中与 Claude 交互，支持代码生成、重构、调试、Git 操作等完整开发工作流。', tags:['Anthropic','CLI','AI编程'], date:'2026-05-20' },
            { id:2, cat:'github', title:'ComfyUI', link:'https://github.com/comfyanonymous/ComfyUI', desc:'基于节点的 Stable Diffusion 工作流引擎，支持高度自定义的图像/视频生成管线，模块化搭建 AI 创作流程。', tags:['Stable Diffusion','工作流','图像生成'], date:'2026-05-15' },
            { id:3, cat:'github', title:'LangChain', link:'https://github.com/langchain-ai/langchain', desc:'LLM 应用开发框架，提供链式调用、Agent 编排、RAG 检索增强等能力，快速构建 AI 驱动的应用。', tags:['LLM','框架','RAG'], date:'2026-05-10' },
            { id:4, cat:'github', title:'RunwayML', link:'https://github.com/runwayml', desc:'AI 视频生成与编辑工具集，提供 Gen-2/Gen-3/Gen-4 等视频生成模型的 API 接口与创作工具。', tags:['视频生成','API','AI创作'], date:'2026-05-08' },
            { id:5, cat:'skill', title:'视频分析助手 Skill', desc:'Claude Code 自定义 Skill，上传视频后自动提取关键帧，从内容概述、用户画像、数据预测、竞品对标等多维度输出分析报告。', tags:['Claude','视频分析','报告生成'], date:'2026-05-05' },
            { id:6, cat:'skill', title:'Adobe Stock 批量上传 Skill', desc:'本地 AI 程序，批量处理图片生成 Adobe Stock 标准的标题、关键词和分类目录，输出 CSV 批量上传文件。', tags:['Adobe Stock','图片处理','CSV'], date:'2026-04-28' },
            { id:7, cat:'github', title:'FFmpeg', link:'https://github.com/FFmpeg/FFmpeg', desc:'跨平台音视频处理工具集，支持几乎所有格式的编解码、转码、复用、流化，视频工作流的核心依赖。', tags:['视频处理','编解码','CLI'], date:'2026-04-20' },
            { id:8, cat:'skill', title:'数据分析自动化 Skill', desc:'Python 脚本集成的 Skill，自动抓取视频播放数据、关键帧提取、色彩分析、音频波形可视化，一键生成分析图表。', tags:['Python','自动化','可视化'], date:'2026-04-15' },
            { id:9, cat:'skill', title:'Video to AE Footage Skill', download:'video-to-ae-footage-skill/', desc:'将视频项目导出为 After Effects 工程文件（AEP），保留真实图片素材引用而非扁平截图。自动生成 JSX 脚本，在 AE 中一键构建场景预合成、可编辑文字层、素材层及 MP4 参考。支持 9:16 竖屏、多镜头分镜、含完整 manifest 清单。', tags:['After Effects','JSX','视频导出','AE脚本'], date:'2026-05-25' },
        ];

        function loadUserEntries() {
            try {
                const raw = localStorage.getItem(STORAGE_USER);
                if(raw) return JSON.parse(raw);
            } catch(e) {}
            return [];
        }

        function saveUserEntries(entries) {
            localStorage.setItem(STORAGE_USER, JSON.stringify(entries));
        }

        function loadDeletedIds() {
            try {
                const raw = localStorage.getItem(STORAGE_DELETED);
                if(raw) return new Set(JSON.parse(raw));
            } catch(e) {}
            return new Set();
        }

        function saveDeletedIds(ids) {
            localStorage.setItem(STORAGE_DELETED, JSON.stringify([...ids]));
        }

        function getAllEntries() {
            const deletedIds = loadDeletedIds();
            const presets = defaultData.filter(d => !deletedIds.has(d.id));
            const userEntries = loadUserEntries();
            return [...presets, ...userEntries];
        }

        let deletedIds = loadDeletedIds();
        let userEntries = loadUserEntries();
        let knowledgeData = getAllEntries();
        let nextUserIds = userEntries.reduce((max, d) => {
            return (d.id >= USER_MIN_ID && d.id > max) ? d.id : max;
        }, USER_MIN_ID - 1);

        const grid = document.getElementById('knowledgeGrid');
        const searchInput = document.getElementById('searchInput');
        const filterTabs = document.getElementById('filterTabs');
        const noResult = document.getElementById('noResult');
        const resultCount = document.getElementById('resultCount');
        let activeCat = 'all';

        function renderCards(data) {
            grid.innerHTML = '';
            if(data.length === 0) {
                grid.style.display = 'none';
                noResult.style.display = 'block';
                resultCount.textContent = '0 条结果';
                return;
            }
            grid.style.display = '';
            noResult.style.display = 'none';
            resultCount.textContent = data.length + ' 条结果';
            data.forEach((item, idx) => {
                const catLabel = item.cat === 'github' ? 'GitHub 项目' : 'AI Agent Skill';
                const card = document.createElement('div');
                card.className = 'knowledge-card interactable';
                card.style.animationDelay = (idx * 0.04) + 's';
                const tagsHtml = item.tags && item.tags.length
                    ? `<div class="k-card-tags">${item.tags.map(t => `<span class="k-tag">${t}</span>`).join('')}</div>`
                    : '';
                const linkHtml = item.link
                    ? `<a href="${item.link}" target="_blank" class="k-card-link interactable" onclick="event.stopPropagation()">OPEN &#8599;</a>`
                    : '';
                const dlHtml = item.download
                    ? `<a href="${item.download}" class="k-card-dl interactable" onclick="event.stopPropagation()">&#128229; 下载</a>`
                    : '';
                const dateHtml = item.date || '';
                card.innerHTML = `
                    <div class="k-card-header">
                        <span class="k-card-category ${item.cat}">${catLabel}</span>
                        <button class="k-card-delete interactable" data-id="${item.id}" title="删除此条目">DEL</button>
                    </div>
                    <h3 class="k-card-title">${escapeHtml(item.title)}</h3>
                    <p class="k-card-desc">${escapeHtml(item.desc)}</p>
                    ${tagsHtml}
                    <div class="k-card-meta">
                        <span class="date">${dateHtml}</span>
                        <span>${linkHtml}${dlHtml}</span>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.querySelectorAll('.k-card-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    if(id < USER_MIN_ID) {
                        if(!confirm('删除该预设条目？（可通过清除浏览器站点数据恢复）')) return;
                        deletedIds.add(id);
                        saveDeletedIds(deletedIds);
                    } else {
                        if(!confirm('确认删除该条目？')) return;
                        userEntries = userEntries.filter(d => d.id !== id);
                        saveUserEntries(userEntries);
                    }
                    knowledgeData = getAllEntries();
                    filterData();
                });
            });
        }

        function escapeHtml(str) {
            if(!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function filterData() {
            const all = getAllEntries();
            const query = searchInput.value.toLowerCase().trim();
            let filtered = activeCat === 'all' ? all : all.filter(d => d.cat === activeCat);
            if(query) {
                filtered = filtered.filter(d =>
                    d.title.toLowerCase().includes(query) ||
                    d.desc.toLowerCase().includes(query) ||
                    (d.tags && d.tags.some(t => t.toLowerCase().includes(query)))
                );
            }
            knowledgeData = all;
            renderCards(filtered);
        }

        searchInput.addEventListener('input', filterData);

        filterTabs.addEventListener('click', (e) => {
            if(e.target.classList.contains('filter-tab')) {
                filterTabs.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                activeCat = e.target.dataset.cat;
                filterData();
            }
        });

        /* ── 弹窗逻辑 ── */
        const modalOverlay = document.getElementById('modalOverlay');
        const btnAdd = document.getElementById('btnAdd');
        const btnCancel = document.getElementById('btnCancel');
        const btnSubmit = document.getElementById('btnSubmit');
        const formCat = document.getElementById('formCat');
        const formTitle = document.getElementById('formTitle');
        const formLink = document.getElementById('formLink');
        const formDl = document.getElementById('formDl');
        const formDesc = document.getElementById('formDesc');
        const formTags = document.getElementById('formTags');

        function openModal() {
            modalOverlay.classList.add('open');
            formTitle.focus();
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
            formCat.value = 'github';
            formTitle.value = '';
            formLink.value = '';
            formDl.value = '';
            formDesc.value = '';
            formTags.value = '';
        }

        btnAdd.addEventListener('click', openModal);
        btnCancel.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if(e.target === modalOverlay) closeModal();
        });

        btnSubmit.addEventListener('click', () => {
            const title = formTitle.value.trim();
            const desc = formDesc.value.trim();
            if(!title) { alert('请填写名称'); return; }
            if(!desc) { alert('请填写描述'); return; }

            const tags = formTags.value
                .split(/[,，]/)
                .map(t => t.trim())
                .filter(t => t.length > 0);

            const now = new Date();
            const dateStr = now.getFullYear() + '-' +
                String(now.getMonth()+1).padStart(2,'0') + '-' +
                String(now.getDate()).padStart(2,'0');

            nextUserIds++;
            const entry = {
                id: nextUserIds,
                cat: formCat.value,
                title: title,
                link: formLink.value.trim(),
                download: formDl.value.trim(),
                desc: desc,
                tags: tags,
                date: dateStr
            };

            userEntries.unshift(entry);
            saveUserEntries(userEntries);
            knowledgeData = getAllEntries();
            closeModal();
            filterData();
        });

        /* ── 键盘快捷键 ── */
        document.addEventListener('keydown', (e) => {
            if((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                openModal();
            }
            if(e.key === 'Escape' && modalOverlay.classList.contains('open')) {
                closeModal();
            }
        });

        renderCards(knowledgeData);

        /* ── 音频 / 主题 系统 ── */
        document.addEventListener('DOMContentLoaded', () => {
            const bgmAudio = document.getElementById('bgmAudio');
            const hoverSound = document.getElementById('hoverSound');
            const clickSound = document.getElementById('clickSound');
            const specialSound = document.getElementById('specialSound');
            const audioToggle = document.getElementById('audioToggle');
            const bgmVol = document.getElementById('bgmVol');
            const hoverVol = document.getElementById('hoverVol');
            const clickVol = document.getElementById('clickVol');
            const specialVol = document.getElementById('specialVol');
            const volHeader = document.getElementById('volHeader');
            const volumePanel = document.getElementById('volumePanel');
            const volIcon = document.getElementById('volIcon');
            let isAudioEnabled = false;

            bgmVol.addEventListener('input', (e) => {
                if(isAudioEnabled) bgmAudio.volume = e.target.value;
            });

            audioToggle.addEventListener('click', () => {
                isAudioEnabled = !isAudioEnabled;
                if(isAudioEnabled) {
                    audioToggle.innerHTML = '[ AUDIO: ON ]';
                    audioToggle.classList.remove('muted');
                    bgmAudio.volume = bgmVol.value;
                    bgmAudio.play().catch(() => {});
                    playSound(clickSound, clickVol);
                } else {
                    audioToggle.innerHTML = '[ AUDIO: OFF ]';
                    audioToggle.classList.add('muted');
                    bgmAudio.pause();
                }
            });

            volHeader.addEventListener('click', () => {
                volumePanel.classList.toggle('collapsed');
                volIcon.textContent = volumePanel.classList.contains('collapsed') ? '[+]' : '[-]';
                playSound(clickSound, clickVol);
            });

            function playSound(audioElement, volInputRef) {
                if(!isAudioEnabled) return;
                audioElement.currentTime = 0;
                audioElement.volume = volInputRef.value;
                audioElement.play().catch(() => {});
            }

            const interactables = document.querySelectorAll('.interactable');
            interactables.forEach(el => {
                el.addEventListener('mouseenter', () => playSound(hoverSound, hoverVol));
                if (el.tagName.toLowerCase() === 'a' || el.tagName.toLowerCase() === 'button') {
                    if(!el.classList.contains('vol-slider') && el.id !== 'volHeader') {
                        if(el.classList.contains('nav-logo')) {
                            el.addEventListener('click', (e) => { e.preventDefault(); playSound(specialSound, specialVol); });
                        } else {
                            el.addEventListener('click', () => playSound(clickSound, clickVol));
                        }
                    }
                }
            });

            const themeBtn = document.getElementById('themeBtn');
            const body = document.body;
            themeBtn.addEventListener('click', () => {
                body.classList.toggle('light-mode');
                themeBtn.innerHTML = body.classList.contains('light-mode') ? 'MED_DEPT' : 'OP_DEPT';
            });
        });
    </script>
</body>
</html>
