<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Design // Rhodes Island</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --ak-bg-main:#050505; --ak-bg-panel:rgba(18,18,20,0.92); --ak-text-main:#ffffff; --ak-text-muted:#7a7a7a; --ak-accent-info:#00d8ff; --ak-accent-warn:#f5a623; --ak-border:#2a2a2a; --ak-scan-line:rgba(0,216,255,0.03); }
        body.light-mode { --ak-bg-main:#e5e7eb; --ak-bg-panel:rgba(255,255,255,0.95); --ak-text-main:#111; --ak-border:#ccc; }
        * { box-sizing:border-box; margin:0; padding:0; }
        
        /* ✨ 开启平滑滚动与主题平滑切换 */
        html { scroll-behavior: smooth; }
        body { background:var(--ak-bg-main); color:var(--ak-text-main); font-family:'Space Grotesk',sans-serif; line-height:1.6; overflow-x:hidden; counter-reset:gallery-counter; transition: background 0.4s ease, color 0.4s ease; }
        
        @keyframes fadeUp { 0%{opacity:0;transform:translateY(20px);} 100%{opacity:1;transform:translateY(0);} }

        /* 战术背景 */
        .tech-bg { position:fixed; inset:0; z-index:-10; background-color:var(--ak-bg-main); background-image:url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2070&auto=format&fit=crop'); background-size:cover; background-position:center; opacity:0.15; filter:grayscale(100%); transition:0.4s; }
        .tech-overlay { position:fixed; inset:0; z-index:-9; pointer-events:none; background:linear-gradient(var(--ak-scan-line) 1px,transparent 1px),linear-gradient(90deg,var(--ak-scan-line) 1px,transparent 1px); background-size:40px 40px; }
        
        body.light-mode .tech-overlay { 
            background: 
                radial-gradient(circle at 50% 50%, transparent 20%, rgba(240,242,245,0.85) 100%),
                linear-gradient(rgba(2, 132, 199, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(2, 132, 199, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .prts-hud { position:fixed; inset:20px; z-index:-8; border:1px solid rgba(0,216,255,0.05); pointer-events:none; background:linear-gradient(var(--ak-accent-info),var(--ak-accent-info)) top left/30px 2px no-repeat,linear-gradient(var(--ak-accent-info),var(--ak-accent-info)) top left/2px 30px no-repeat,linear-gradient(var(--ak-accent-info),var(--ak-accent-info)) top right/30px 2px no-repeat,linear-gradient(var(--ak-accent-info),var(--ak-accent-info)) top right/2px 30px no-repeat,linear-gradient(var(--ak-accent-info),var(--ak-accent-info)) bottom left/30px 2px no-repeat,linear-gradient(var(--ak-accent-info),var(--ak-accent-info)) bottom left/2px 30px no-repeat,linear-gradient(var(--ak-accent-info),var(--ak-accent-info)) bottom right/30px 2px no-repeat,linear-gradient(var(--ak-accent-info),var(--ak-accent-info)) bottom right/2px 30px no-repeat; transition: 0.4s; }

        /* 导航与标题 */
        nav { position:fixed; top:0; width:100%; padding:15px 5vw; display:flex; justify-content:space-between; align-items:center; background:var(--ak-bg-panel); border-bottom:1px solid var(--ak-border); z-index:1000; backdrop-filter:blur(10px); transition: 0.4s; }
        .nav-logo { font:800 1rem 'Space Mono'; letter-spacing:2px; color:var(--ak-text-main); text-decoration:none; border:1px solid var(--ak-accent-info); padding:5px 12px; cursor: pointer; }
        .nav-right { display:flex; align-items:center; gap:30px; }
        .nav-links { display:flex; gap:25px; font:0.85rem 'Space Mono'; }
        .nav-links a { color:var(--ak-text-main); text-decoration:none; font-weight:700; text-transform:uppercase; transition:0.3s; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color:var(--ak-accent-info); text-shadow:0 0 8px var(--ak-accent-info); }
        .nav-home-btn { padding:6px 14px; background:transparent; color:var(--ak-accent-warn); border:1px solid var(--ak-accent-warn); font:700 0.85rem 'Space Mono'; text-decoration:none; transition:0.3s; cursor: pointer; }
        .nav-home-btn:hover { background:var(--ak-accent-warn); color:#000; }
        
        .page-header { text-align:center; margin:140px auto 40px; animation:fadeUp 0.6s forwards; position:relative; z-index:10;}
        .page-header h1 { font:800 2.2rem 'Space Mono'; color:var(--ak-accent-info); margin-bottom:10px; }

        /* ================= 音频控制区 (左侧) ================= */
        .audio-toggle-btn {
            position: fixed; top: 80px; left: 5vw; 
            background: rgba(10, 10, 12, 0.8); backdrop-filter: blur(5px);
            color: var(--ak-accent-info); border: 1px solid var(--ak-accent-info); 
            padding: 6px 12px; font-family: 'Space Mono', monospace; font-size: 0.75rem; font-weight: bold;
            cursor: pointer; z-index: 999; transition: 0.3s; border-radius: 2px;
            width: 170px; text-align: center; letter-spacing: 1px;
        }
        .audio-toggle-btn:hover { background: var(--ak-accent-info); color: #000; box-shadow: 0 0 10px var(--ak-accent-info);}
        .audio-toggle-btn.muted { color: var(--ak-text-muted); border-color: var(--ak-text-muted); }
        .audio-toggle-btn.muted:hover { background: var(--ak-text-muted); color: #000; }

        /* ✨ 战术混音台 (支持折叠收放) ✨ */
        .volume-panel {
            position: fixed; top: 125px; left: 5vw; 
            background: rgba(10, 10, 12, 0.85); backdrop-filter: blur(5px);
            border: 1px solid var(--ak-border); border-top: 3px solid var(--ak-border);
            padding: 15px; width: 170px; z-index: 998; 
            transition: 0.3s opacity, 0.3s border-color;
            opacity: 0.5; overflow: hidden;
        }
        .volume-panel:hover { opacity: 1; border-color: var(--ak-accent-info); box-shadow: 0 0 15px rgba(0, 216, 255, 0.1); }
        
        .vol-header {
            font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--ak-accent-info);
            font-weight: bold; padding-bottom: 5px; text-transform: uppercase;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px dashed var(--ak-border); transition: 0.2s color;
        }
        .vol-header:hover { color: var(--ak-text-main); }
        
        .vol-content {
            display: flex; flex-direction: column; gap: 12px;
            transition: max-height 0.3s ease, opacity 0.3s ease, margin-top 0.3s ease;
            max-height: 200px; opacity: 1; margin-top: 10px;
        }
        .volume-panel.collapsed .vol-content { max-height: 0; opacity: 0; margin-top: 0; pointer-events: none; }
        .volume-panel.collapsed .vol-header { border-bottom: none; padding-bottom: 0; }

        .vol-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .vol-row label { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--ak-text-muted); width: 40px; text-align: left; }
        .vol-slider { -webkit-appearance: none; width: 100%; height: 3px; background: var(--ak-border); outline: none; border-radius: 2px; }
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 12px; background: var(--ak-accent-info); cursor: pointer; border-radius: 1px; }
        .vol-slider::-webkit-slider-thumb:hover { background: var(--ak-accent-warn); }

        /* ================= 主题切换悬浮键 ================= */
        .theme-toggle-btn { 
            position: fixed; bottom: 30px; right: 30px; background: var(--ak-bg-main); 
            color: var(--ak-text-muted); border: 1px solid var(--ak-border); 
            padding: 12px 16px; font-family: 'Space Mono', monospace; font-size: 0.8rem; 
            font-weight: 700; cursor: pointer; z-index: 1500; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .theme-toggle-btn:hover { border-color: var(--ak-accent-info); color: var(--ak-accent-info); transform: translateY(-3px);}

        /* ✨ 瀑布流卡片与图片 ✨ */
        .masonry-gallery { max-width:1600px; margin:0 auto; padding:0 5vw 80px; column-count:4; column-gap:24px; position:relative; z-index:10;}
        .masonry-item { break-inside:avoid; margin-bottom:24px; background:var(--ak-bg-panel); backdrop-filter:blur(10px); border:1px solid var(--ak-border); border-top:3px solid var(--ak-border); padding:10px; opacity:0; animation:fadeUp 0.6s forwards; transition:0.4s; position:relative; cursor: pointer; }
        
        /* 强制覆盖 content 的数值内容，解决数字顺序跳跃的问题 */
        .masonry-item::before { counter-increment:gallery-counter; content:"[IMG-0" counter(gallery-counter) "]"; position:absolute; top:20px; left:20px; font:bold 0.65rem 'Space Mono'; color:#000; background:var(--ak-text-muted); padding:2px 8px; z-index:10; transition:0.3s; opacity:0;}
        
        .masonry-item:hover { border-color:var(--ak-accent-info); transform:translateY(-4px); box-shadow:0 10px 30px rgba(0,216,255,0.1); }
        .masonry-item:hover::before { opacity:1; background:var(--ak-accent-info); }
        
        .masonry-item img { width:100%; display:block; transition:0.4s; cursor:zoom-in; }
        .masonry-item:hover img { transform: scale(1.02); }

        /* 灯箱与底部 */
        .lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:3000; display:none; justify-content:center; align-items:center; }
        .lightbox.active { display:flex; }
        .lightbox img { max-width:90vw; max-height:90vh; border:2px solid var(--ak-accent-info); object-fit:contain; }
        .lightbox-close { position:absolute; top:25px; right:40px; color:#fff; cursor:pointer; font:bold 1.2rem 'Space Mono'; border:1px solid #fff; padding:6px 12px; transition: 0.3s; }
        .lightbox-close:hover { background: #fff; color: #000; }
        
        .back-nav { text-align:center; margin-bottom:80px; position:relative; z-index:10;}
        .btn-back { display:inline-block; padding:12px 30px; border:1px solid var(--ak-border); color:var(--ak-text-main); font:700 1rem 'Space Mono'; text-decoration:none; transition:0.3s; cursor: pointer; }
        .btn-back:hover { background:var(--ak-accent-info); color:#000; border-color:var(--ak-accent-info); }
        footer { text-align:center; padding:40px; color:var(--ak-text-muted); font:700 0.75rem 'Space Mono'; position:relative; z-index:10; }
        
        /* 移动端适配 (按钮防遮挡) */
        @media (max-width:1200px) { .masonry-gallery { column-count:3; } }
        @media (max-width:900px) { .masonry-gallery { column-count:2; } .nav-links { display:none; } }
        @media (max-width:768px) { 
            .audio-toggle-btn { top: auto; bottom: 20px; left: 20px; z-index: 2000; width: 120px; padding: 10px;} 
            .volume-panel { top: auto; bottom: 70px; left: 20px; transform: scale(0.85); transform-origin: bottom left; z-index: 1999; }
            .theme-toggle-btn { bottom: 20px; right: 20px; z-index: 2000;}
        }
        @media (max-width:600px) { .masonry-gallery { column-count:1; } }
    </style>
</head>
<body class="dark-mode">

    <audio id="bgmAudio" loop preload="auto"><source src="音效/Sowing Chia Seed.mp3" type="audio/mpeg"></audio>
    <audio id="hoverSound" preload="auto"><source src="音效/鼠标悬停.mp3" type="audio/mpeg"></audio>
    <audio id="clickSound" preload="auto"><source src="音效/鼠标点击.mp3" type="audio/mpeg"></audio>
    <audio id="specialSound" preload="auto"><source src="音效/点击头像.mp3" type="audio/mpeg"></audio>

    <button id="audioToggle" class="audio-toggle-btn muted interactable">[ AUDIO: OFF ]</button>
    
    <div class="volume-panel" id="volumePanel">
        <div class="vol-header interactable" id="volHeader">
            <span>AUDIO_MIXER</span>
            <span id="volIcon">[-]</span>
        </div>
        <div class="vol-content" id="volContent">
            <div class="vol-row">
                <label>BGM</label>
                <input type="range" class="vol-slider interactable" id="bgmVol" min="0" max="1" step="0.01" value="0.35">
            </div>
            <div class="vol-row">
                <label>HOVR</label>
                <input type="range" class="vol-slider interactable" id="hoverVol" min="0" max="1" step="0.01" value="0.60">
            </div>
            <div class="vol-row">
                <label>CLCK</label>
                <input type="range" class="vol-slider interactable" id="clickVol" min="0" max="1" step="0.01" value="0.80">
            </div>
            <div class="vol-row">
                <label>SPEC</label>
                <input type="range" class="vol-slider interactable" id="specialVol" min="0" max="1" step="0.01" value="0.80">
            </div>
        </div>
    </div>

    <button class="theme-toggle-btn interactable" id="themeBtn" aria-label="Toggle Theme">SYS_DARK</button>

    <div class="tech-bg"></div><div class="tech-overlay"></div><div class="prts-hud"></div>

    <nav>
        <a class="nav-logo interactable">PRTS // CLARENCE YE</a>
        <div class="nav-right">
            <div class="nav-links">
                <a href="数据分析/Data Analysis.html" class="interactable">Data Analysis</a>
                <a href="my graphic design.html" class="active interactable">Graphic</a>
                <a href="3d model.html" class="interactable">3D Art</a>
                <a href="my vedio.html" class="interactable">Video</a>
                <a href="https://500px.com.cn/community/user-details/afaa01dec4d8a92773525ab8dbf633449" target="_blank" class="interactable">Gallery</a>
            </div>
            <a href="Spike's profolio.html" class="nav-home-btn interactable">[ RETURN ]</a>
        </div>
    </nav>

    <header class="page-header">
        <h1>[ GRAPHIC // UI DESIGN ]</h1><p style="color:var(--ak-text-muted);">海报、包装、图形设计与排版艺术</p>
    </header>

    <main class="masonry-gallery" id="galleryBox">
    </main>

    <div class="back-nav"><a href="Spike's profolio.html" class="btn-back interactable">[ RETURN ]</a></div>
    <footer><p>> Rhodes Island Archive // System.2026</p></footer>

    <div class="lightbox" id="lightbox"><span class="lightbox-close interactable">[ X ]</span><img src="" id="lightbox-img"></div>

    <script>
        const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
        document.addEventListener('DOMContentLoaded', () => {
            const box = $('#galleryBox');
            
            // 核心修复：独立维护图片的索引，使 GIF 块不占用 JPG 的文件名序号
            let jpgIndex = 1;
            // 页面实际渲染的卡片计数（用于处理动画延迟）
            let renderCounter = 1;
            
            // 循环遍历，最高循环到 34 结束
            for(let i=1; i<=34; i++) {
                
                // 1. 跳过指定的图片索引 (IMG-028 到 IMG-031 对应的 jpg)
                if (jpgIndex >= 28 && jpgIndex <= 31 && i !== 20) {
                    jpgIndex++;
                    continue; 
                }

                // 2. 将 GIF 块固定插入在原本图片19的位置之后 (i === 20 时插入)
                if (i === 20) {
                    box.innerHTML += `
                        <div class="masonry-item interactable" style="animation-delay:${renderCounter*0.03}s">
                            <div style="display: flex; flex-direction: column;">
                                
                                <div style="color: #48E5B6; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 900; font-size: 0.85rem; margin-bottom: 12px; letter-spacing: 1px; line-height: 1; text-transform: none; text-shadow: none;">
                                    企业活动gif
                                </div>
                                
                                <div style="display: flex; gap: 12px; width: 100%; height: 220px;">
                                    <div style="flex: 1.2; overflow: hidden; border-radius: 2px;">
                                        <img src="1024_ae_1.gif" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; display: block;" class="img-clicker">
                                    </div>
                                    <div style="flex: 1; overflow: hidden; border-radius: 2px;">
                                        <img src="M星巡游_5.gif" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; display: block;" class="img-clicker">
                                    </div>
                                </div>
                                
                            </div>
                        </div>`;
                    renderCounter++;
                } else {
                    // 3. 生成普通的 JPG 瀑布流块
                    let fileName = `${jpgIndex}1.jpg`;
                    
                    // emo1.jpg ~ emo5.jpg 的映射逻辑保持不变 (对应 22-26)
                    if (jpgIndex >= 22 && jpgIndex <= 26) { 
                        fileName = `emo${jpgIndex - 21}.jpg`; 
                    }

                    box.innerHTML += `<div class="masonry-item interactable" style="animation-delay:${renderCounter*0.03}s"><img src="平面设计导出jpg的副本/${fileName}" loading="lazy" class="img-clicker"></div>`;
                    
                    jpgIndex++;
                    renderCounter++;
                }
            }
            
            const lb = $('#lightbox'), lbImg = $('#lightbox-img');
            const toggleLB = (src = '') => { lbImg.src = src; lb.classList.toggle('active'); document.body.style.overflow = src ? 'hidden' : ''; };
            
            lb.onclick = e => { if (e.target !== lbImg) toggleLB(); };

            /* --- ✨ 全局系统：音效与交互 ✨ --- */
            const bgmAudio = document.getElementById('bgmAudio');
            const hoverSound = document.getElementById('hoverSound');
            const clickSound = document.getElementById('clickSound');
            const specialSound = document.getElementById('specialSound'); 
            const audioToggle = document.getElementById('audioToggle');
            
            const bgmVol = document.getElementById('bgmVol');
            const hoverVol = document.getElementById('hoverVol');
            const clickVol = document.getElementById('clickVol');
            const specialVol = document.getElementById('specialVol');

            const volHeader = document.getElementById('volHeader');
            const volumePanel = document.getElementById('volumePanel');
            const volIcon = document.getElementById('volIcon');
            
            let isAudioEnabled = false; 

            // 将变量挂载到 window，使 img 的 onclick 也能访问
            window.isAudioEnabled = false; 
            window.clickSound = clickSound;
            window.clickVol = clickVol;

            // BGM 实时音量调节
            bgmVol.addEventListener('input', (e) => {
                if(isAudioEnabled) { bgmAudio.volume = e.target.value; }
            });

            // 总开关
            audioToggle.addEventListener('click', () => {
                isAudioEnabled = !isAudioEnabled;
                window.isAudioEnabled = isAudioEnabled; // 同步全局状态
                if(isAudioEnabled) {
                    audioToggle.innerHTML = '[ AUDIO: ON ]';
                    audioToggle.classList.remove('muted');
                    bgmAudio.volume = bgmVol.value; 
                    bgmAudio.play().catch(e => console.log("BGM autoplay prevented"));
                    playSound(clickSound, clickVol); 
                } else {
                    audioToggle.innerHTML = '[ AUDIO: OFF ]';
                    audioToggle.classList.add('muted');
                    bgmAudio.pause();
                }
            });

            // 混音台折叠/展开逻辑
            volHeader.addEventListener('click', () => {
                volumePanel.classList.toggle('collapsed');
                volIcon.textContent = volumePanel.classList.contains('collapsed') ? '[+]' : '[-]';
                playSound(clickSound, clickVol);
            });

            function playSound(audioElement, volInputRef) {
                if(!isAudioEnabled) return;
                audioElement.currentTime = 0;
                audioElement.volume = volInputRef.value;
                let playPromise = audioElement.play();
                if (playPromise !== undefined) { playPromise.catch(error => {}); }
            }

            // 动态绑定音效 (延时等待DOM生成完毕)
            setTimeout(() => {
                // 1. 为生成的瀑布流图片单独绑定灯箱与点击音效
                $$('.img-clicker').forEach(img => {
                    img.onclick = () => {
                        toggleLB(img.src);
                        if(window.isAudioEnabled) {
                            window.clickSound.currentTime = 0;
                            window.clickSound.volume = window.clickVol.value;
                            window.clickSound.play().catch(e=>{});
                        }
                    };
                });

                // 2. 为其他按钮、卡片绑定悬停和点击
                const interactables = document.querySelectorAll('.interactable, button, a, .masonry-item, .lightbox-close');
                interactables.forEach(el => {
                    // 悬停音效
                    el.addEventListener('mouseenter', () => playSound(hoverSound, hoverVol));
                    
                    // 点击音效
                    if (el.tagName.toLowerCase() === 'button' || el.tagName.toLowerCase() === 'a' || el.classList.contains('lightbox-close')) {
                        // 排除滑块本身和折叠头
                        if(!el.classList.contains('vol-slider') && el.id !== 'volHeader') {
                            if(el.classList.contains('nav-logo')) {
                                el.addEventListener('click', (e) => {
                                    e.preventDefault(); 
                                    playSound(specialSound, specialVol);
                                });
                            } else {
                                el.addEventListener('click', () => playSound(clickSound, clickVol));
                            }
                        }
                    }
                });
            }, 200);

            /* --- 主题切换 --- */
            const themeBtn = document.getElementById('themeBtn');
            const body = document.body;

            themeBtn.addEventListener('click', () => {
                body.classList.toggle('light-mode');
                themeBtn.innerHTML = body.classList.contains('light-mode') ? 'MED_DEPT' : 'OP_DEPT';
            });
        });
    </script>
</body>
</html>
