    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: #f9f9f9; /* 整个页面加一点极浅的灰底，突出白底的图片 */
        }

        /* 头部样式 */
        .header {
            padding: 40px 20px;
            text-align: center;
            background: #1abc9c;
            color: white;
        }

        .header h1 {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .header p {
            font-style: italic;
            margin: 5px 0;
            font-size: 14px;
        }

        /* 导航栏样式优化 */
        .custom-navbar {
            background-color: #333;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .custom-navbar a {
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .custom-navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        
        .custom-navbar img {
            margin-top: -5px;
            margin-bottom: -5px;
        }

        /* 画廊展示区样式 (替代原来的 <br> 和 <center>) */
        .portfolio-gallery {
            display: flex;
            flex-direction: column;
            align-items: center; /* 居中所有图片 */
            gap: 40px; /* 图片之间的间距，只需改这里就能统一调整 */
            padding: 40px 15px;
        }

        .portfolio-gallery img {
            width: 100%;
            max-width: 900px; /* 电脑端最大宽度，防止图片过大 */
            border-radius: 8px; /* 微微的圆角 */
            box-shadow: 0 10px 20px rgba(0,0,0,0.08); /* 添加一点高级的阴影 */
            background-color: white; /* 给透明图片一个白色底 */
        }

        .footer {
            padding: 30px;
            text-align: center;
            background: #ddd;
            color: #555;
            margin-top: 20px;
        }

        /* 手机端适配 */
        @media screen and (max-width: 600px) {
            .custom-navbar {
                flex-direction: column;
                width: 100%;
            }
            .custom-navbar a {
                width: 100%;
                box-sizing: border-box;
            }
            .portfolio-gallery {
                gap: 20px; /* 手机端图片间距缩小一点 */
                padding: 20px 10px;
            }
        }
    </style>
</head>
