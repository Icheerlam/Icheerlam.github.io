<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Design // Rhodes Island</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --ak-bg-main:#050505; --ak-bg-panel:rgba(18,18,20,0.92); --ak-text-main:#ffffff; --ak-text-muted:#7a7a7a; --ak-accent-info:#00d8ff; --ak-accent-warn:#f5a623; --ak-border:#2a2a2a; --ak-scan-line:rgba(0,216,255,0.03); }
        body.light-mode { --ak-bg-main:#e5e7eb; --ak-bg-panel:rgba(255,255,255,0.95); --ak-text-main:#111; --ak-border:#ccc; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--ak-bg-main); color:var(--ak-text-main); font-family:'Space Grotesk',sans-serif; line-height:1.6; overflow-x:hidden; counter-reset:gallery-counter; }
        @keyframes fadeUp { 0%{opacity:0;transform:translateY(20px);} 100%{opacity:1;transform:translateY(0);} }

        /* 战术背景 */
        .tech-bg { position:fixed; inset:0; z-index:-10; background-color:var(--ak-bg-main); background-image:url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2070&auto=format&fit=crop'); background-size:cover; background-position:center; opacity:0.15; filter:grayscale(100%); transition:0.4s; }
        .tech-overlay { position:fixed; inset:0; z-index:-9; pointer-events:none; background:linear-gradient(var(--ak-scan-line) 1px,transparent 1px),linear-gradient(90deg,var(--ak-scan-line) 1px,transparent 1px); background-size:40px 40px; }
        .prts-hud { position:fixed; inset:20px; z-index:-8; border:1px solid rgba(0,216,255,0.05); pointer-events:none; background:linear-gradient(var(--ak-accent-info),var(--ak-accent-info)) top left/30px 2px no-repeat,linear-gradient(var(--ak-accent-info),var(--ak-accent-info)) top left/2px 30px no-repeat,linear-gradient(var(--ak-accent-info),var(--ak-accent-info)) top right/30px 2px no-repeat,linear-gradient(var(--ak-accent-info),var(--ak-accent-info)) top right/2px 30px no-repeat,linear-gradient(var(--ak-accent-info),var(--ak-accent-info)) bottom left/30px 2px no-repeat,linear-gradient(var(--ak-accent-info),var(--ak-accent-info)) bottom left/2px 30px no-repeat,linear-gradient(var(--ak-accent-info),var(--ak-accent-info)) bottom right/30px 2px no-repeat,linear-gradient(var(--ak-accent-info),var(--ak-accent-info)) bottom right/2px 30px no-repeat; }

        /* 导航与标题 */
        nav { position:fixed; top:0; width:100%; padding:15px 5vw; display:flex; justify-content:space-between; align-items:center; background:var(--ak-bg-panel); border-bottom:1px solid var(--ak-border); z-index:1000; backdrop-filter:blur(10px); transition: 0.4s; }
        .nav-logo { font:800 1rem 'Space Mono'; letter-spacing:2px; color:var(--ak-text-main); text-decoration:none; border:1px solid var(--ak-accent-info); padding:5px 12px; }
        .nav-right { display:flex; align-items:center; gap:30px; }
        .nav-links { display:flex; gap:25px; font:0.85rem 'Space Mono'; }
        .nav-links a { color:var(--ak-text-main); text-decoration:none; font-weight:700; text-transform:uppercase; transition:0.3s; }
        .nav-links a:hover, .nav-links a.active { color:var(--ak-accent-info); text-shadow:0 0 8px var(--ak-accent-info); }
        .nav-home-btn { padding:6px 14px; background:transparent; color:var(--ak-accent-warn); border:1px solid var(--ak-accent-warn); font:700 0.85rem 'Space Mono'; text-decoration:none; transition:0.3s; }
        .nav-home-btn:hover { background:var(--ak-accent-warn); color:#000; }
        .page-header { text-align:center; margin:120px auto 40px; animation:fadeUp 0.6s forwards; position:relative; z-index:10;}
        .page-header h1 { font:800 2.2rem 'Space Mono'; color:var(--ak-accent-info); margin-bottom:10px; }

        /* ✨ 瀑布流卡片与图片 */
        .masonry-gallery { max-width:1600px; margin:0 auto; padding:0 5vw 80px; column-count:4; column-gap:24px; position:relative; z-index:10;}
        .masonry-item { break-inside:avoid; margin-bottom:24px; background:var(--ak-bg-panel); backdrop-filter:blur(10px); border:1px solid var(--ak-border); border-top:3px solid var(--ak-border); padding:10px; opacity:0; animation:fadeUp 0.6s forwards; transition:0.4s; position:relative; }
        .masonry-item::before { counter-increment:gallery-counter; content:"[IMG-0" counter(gallery-counter) "]"; position:absolute; top:20px; left:20px; font:bold 0.65rem 'Space Mono'; color:#000; background:var(--ak-text-muted); padding:2px 8px; z-index:10; transition:0.3s; opacity:0;}
        .masonry-item:hover { border-color:var(--ak-accent-info); transform:translateY(-4px); box-shadow:0 10px 30px rgba(0,216,255,0.1); }
        .masonry-item:hover::before { opacity:1; background:var(--ak-accent-info); }
        
        .masonry-item img { width:100%; display:block; transition:0.4s; cursor:zoom-in; }
        .masonry-item:hover img { transform: scale(1.02); }

        /* 灯箱与底部 */
        .lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:3000; display:none; justify-content:center; align-items:center; }
        .lightbox.active { display:flex; }
        .lightbox img { max-width:90vw; max-height:90vh; border:2px solid var(--ak-accent-info); object-fit:contain; }
        .lightbox-close { position:absolute; top:25px; right:40px; color:#fff; cursor:pointer; font:bold 1.2rem 'Space Mono'; border:1px solid #fff; padding:6px 12px; }
        .back-nav { text-align:center; margin-bottom:80px; position:relative; z-index:10;}
        .btn-back { display:inline-block; padding:12px 30px; border:1px solid var(--ak-border); color:var(--ak-text-main); font:700 1rem 'Space Mono'; text-decoration:none; transition:0.3s; cursor: pointer; }
        .btn-back:hover { background:var(--ak-accent-info); color:#000; border-color:var(--ak-accent-info); }
        footer { text-align:center; padding:40px; color:var(--ak-text-muted); font:700 0.75rem 'Space Mono'; position:relative; z-index:10; }
        
        @media (max-width:1200px) { .masonry-gallery { column-count:3; } }
        @media (max-width:900px) { .masonry-gallery { column-count:2; } .nav-links { display:none; } }
        @media (max-width:600px) { .masonry-gallery { column-count:1; } }
    </style>
</head>
<body>
    <div class="tech-bg"></div><div class="tech-overlay"></div><div class="prts-hud"></div>

    <nav>
        <a href="Spike's profolio.html" class="nav-logo">PRTS // CLARENCE YE</a>
        <div class="nav-right">
            <div class="nav-links">
                <a href="数据分析/Data Analysis.html">Data Analysis</a>
                <a href="my graphic design.html" class="active">Graphic</a>
                <a href="3d model.html">3D Art</a>
                <a href="my vedio.html">Video</a>
                <a href="https://500px.com.cn/community/user-details/afaa01dec4d8a92773525ab8dbf633449" target="_blank">Gallery</a>
            </div>
            <a href="Spike's profolio.html" class="nav-home-btn">[ RETURN ]</a>
        </div>
    </nav>

    <header class="page-header">
        <h1>[ GRAPHIC // UI DESIGN ]</h1><p style="color:var(--ak-text-muted);">海报、包装、图形设计与排版艺术</p>
    </header>

    <main class="masonry-gallery" id="galleryBox">
    </main>

    <div class="back-nav"><a href="Spike's profolio.html" class="btn-back">[ RETURN ]</a></div>
    <footer><p>> Rhodes Island Archive // System.2026</p></footer>

    <div class="lightbox" id="lightbox"><span class="lightbox-close">[ X ]</span><img src="" id="lightbox-img"></div>

    <script>
        const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
        document.addEventListener('DOMContentLoaded', () => {
            const box = $('#galleryBox');
            for(let i=1; i<=33; i++) {
                
                // 专门处理 img-019，排版更加规整严谨
                if (i === 19) {
                    box.innerHTML += `
                        <div class="masonry-item" style="animation-delay:${i*0.03}s">
                            <div style="display: flex; flex-direction: column;">
                                
                                <div style="color: #48E5B6; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 900; font-size: 1.25rem; margin-bottom: 12px; letter-spacing: 1px; line-height: 1; text-transform: none; text-shadow: none;">
                                    企业活动gif
                                </div>
                                
                                <div style="display: flex; gap: 12px; width: 100%; height: 260px;">
                                    
                                    <div style="flex: 1.2; overflow: hidden; border-radius: 2px;">
                                        <img src="1024_ae_1.gif" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; display: block;">
                                    </div>
                                    
                                    <div style="flex: 1; overflow: hidden; border-radius: 2px;">
                                        <img src="M星巡游_5.gif" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; display: block;">
                                    </div>
                                </div>
                                
                            </div>
                        </div>`;
                } else {
                    let fileName = `${i}1.jpg`;
                    
                    if (i >= 22 && i <= 26) {
                        fileName = `emo${i - 21}.jpg`;
                    }

                    box.innerHTML += `<div class="masonry-item" style="animation-delay:${i*0.03}s"><img src="平面设计导出jpg的副本/${fileName}" loading="lazy"></div>`;
                }
            }
            const lb = $('#lightbox'), lbImg = $('#lightbox-img');
            const toggleLB = (src = '') => { lbImg.src = src; lb.classList.toggle('active'); document.body.style.overflow = src ? 'hidden' : ''; };
            
            setTimeout(() => { $$('.masonry-item img').forEach(img => img.onclick = () => toggleLB(img.src)); }, 100);
            lb.onclick = e => { if (e.target !== lbImg) toggleLB(); };
        });
    </script>
</body>
</html>
