    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8; /* 稍深的浅灰底色，更好地衬托白色卡片 */
        }

        .header {
            padding: 40px 20px;
            text-align: center;
            background: #1abc9c;
            color: white;
        }

        .header h1 {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .header p {
            font-style: italic;
            margin: 5px 0;
            font-size: 14px;
        }

        /* 导航栏 */
        .custom-navbar {
            background-color: #333;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .custom-navbar a {
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .custom-navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        
        .custom-navbar img {
            margin-top: -5px;
            margin-bottom: -5px;
        }

        /* 卡片式画廊布局 */
        .portfolio-gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 15px;
        }

        /* 独立的卡片样式 */
        .portfolio-card {
            background-color: white;
            width: 100%;
            max-width: 800px; /* 限制最大宽度 */
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); /* 卡片阴影 */
            margin-bottom: 40px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease; /* 鼠标悬停时的动画准备 */
        }

        .portfolio-card:hover {
            transform: translateY(-5px); /* 鼠标放上去卡片会微微上浮 */
        }

        .portfolio-card img, 
        .portfolio-card video {
            width: 100%;
            border-radius: 8px;
            background-color: #eee; /* 防止加载慢时白屏 */
        }

        .portfolio-card h4 {
            margin-top: 20px;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 18px;
        }

        .footer {
            padding: 30px;
            text-align: center;
            background: #ddd;
            color: #555;
        }

        .btn-back {
            background-color: #1abc9c;
            color: white;
            padding: 10px 30px;
            font-size: 16px;
            border-radius: 25px;
            border: none;
            margin-bottom: 30px;
            transition: background 0.3s;
        }

        .btn-back:hover {
            background-color: #16a085;
            color: white;
        }

        @media screen and (max-width: 600px) {
            .custom-navbar {
                flex-direction: column;
                width: 100%;
            }
            .custom-navbar a {
                width: 100%;
                box-sizing: border-box;
            }
            .portfolio-card {
                padding: 10px;
            }
        }
    </style>
</head>
