<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarence Ye | Visual Designer</title>
    <style>
        /* ================= 核心变量 ================= */
        :root {
            --glass-bg: rgba(20, 20, 25, 0.45); 
            --glass-border: rgba(255, 255, 255, 0.1); 
            --glass-border-light: rgba(255, 255, 255, 0.25); 
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); 
            
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --accent: #1abc9c; 
            --accent-glow: rgba(26, 188, 156, 0.6);
            --nav-bg: rgba(10, 10, 12, 0.5);
            --overlay-color: rgba(0, 0, 0, 0.6); 
            
            --recharge: #34d399; 
            --withdraw: #fb7185; 
            --warning: #fbbf24;
        }

        body.light-mode {
            --glass-bg: rgba(255, 255, 255, 0.45); 
            --glass-border: rgba(255, 255, 255, 0.5); 
            --glass-border-light: rgba(255, 255, 255, 0.8); 
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15); 
            
            --text-main: #0f172a; 
            --text-muted: #475569; 
            --accent: #059669; 
            --accent-glow: rgba(5, 150, 105, 0.3);
            --nav-bg: rgba(255, 255, 255, 0.6);
            --overlay-color: rgba(255, 255, 255, 0.3); 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            line-height: 1.6; overflow-x: hidden; 
            transition: color 0.5s ease; 
            background: transparent; 
        }

        .video-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -10; overflow: hidden; background-color: #000; 
        }
        .video-bg video { width: 100%; height: 100%; object-fit: cover; filter: blur(8px) scale(1.05); }
        .video-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -9; background: var(--overlay-color); transition: background 0.5s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------------- 顶部导航栏 ---------------- */
        nav { 
            position: fixed; top: 0; width: 100%; padding: 20px 5vw; 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            z-index: 1000; border-bottom: 1px solid var(--glass-border); 
            transition: background-color 0.5s ease, border-color 0.5s ease;
        }
        .nav-logo { font-weight: 700; font-size: 1.2rem; letter-spacing: 1px; color: var(--text-main); text-decoration: none; }
        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a { color: var(--text-main); text-decoration: none; font-size: 0.95rem; transition: color 0.3s; font-weight: 500; text-shadow: 0 2px 4px rgba(0,0,0,0.2);}
        body.light-mode .nav-links a { text-shadow: none; }
        .nav-links a:hover { color: var(--accent); }
        
        .nav-secret { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 1.2rem; font-weight: 500; transition: transform 0.3s; }
        .nav-secret:hover { transform: scale(1.1); }

        /* ---------------- Bento 网格系统 ---------------- */
        .container { max-width: 1200px; margin: 120px auto 40px; padding: 0 5vw; }
        .bento-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; auto-rows: minmax(min-content, max-content); transition: opacity 0.3s; }

        .bento-card { 
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-border-light); border-left: 1px solid var(--glass-border-light); 
            border-radius: 32px; box-shadow: var(--glass-shadow); padding: 40px; transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); 
            opacity: 0; animation: fadeUp 0.8s ease forwards; position: relative; overflow: hidden;
        }
        .bento-card:hover { border-color: var(--accent); transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); background: rgba(26, 188, 156, 0.05); }

        .bento-card:nth-child(1) { animation-delay: 0.1s; } .bento-card:nth-child(2) { animation-delay: 0.2s; }
        .bento-card:nth-child(3) { animation-delay: 0.3s; } .bento-card:nth-child(4) { animation-delay: 0.4s; }
        .bento-card:nth-child(5) { animation-delay: 0.5s; }

        .card-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 24px; color: var(--text-main); display: flex; align-items: center; gap: 10px; transition: color 0.5s; }
        .card-title::before { content: ''; display: block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent-glow); transition: background 0.5s; }

        /* --- ✨ 3D 磁性悬浮头像样式 --- */
        .card-hero { grid-column: span 2; grid-row: span 2; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 50px 30px; perspective: 1000px; }
        .avatar-container {
            position: relative; width: 140px; height: 140px; margin: 0 auto 24px auto;
            transform-style: preserve-3d; transition: transform 0.1s ease-out; /* JS 接管动画 */
        }
        .hero-avatar { 
            display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; 
            border: 3px solid rgba(255,255,255,0.4); box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
            transform: translateZ(20px); /* 让头像在 3D 空间中浮起来 */
        }
        /* 玻璃反光层 */
        .avatar-glare {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%);
            opacity: 0; transition: opacity 0.3s; transform: translateZ(30px); pointer-events: none;
        }

        .hero-title { font-size: 2.5rem; font-weight: 800; line-height: 1.2; margin-bottom: 16px; letter-spacing: -0.5px; transition: color 0.5s; width: 100%; text-shadow: 0 4px 10px rgba(0,0,0,0.3);}
        body.light-mode .hero-title { text-shadow: none; }
        
        /* --- ✨ AI 打字机副标题样式 --- */
        .hero-subtitle { color: var(--text-muted); font-size: 1.1rem; line-height: 1.8; transition: color 0.5s; width: 100%; min-height: 60px;}
        .typewriter-text { color: var(--accent); font-family: monospace; font-weight: 600; }
        .cursor { display: inline-block; width: 8px; height: 1.2em; background-color: var(--accent); vertical-align: middle; animation: blink 1s step-end infinite; margin-left: 2px;}
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .card-info { grid-column: span 2; display: flex; flex-direction: column; justify-content: space-between;}
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .info-item { color: var(--text-muted); font-size: 0.95rem; transition: color 0.5s;}
        .info-item strong { color: var(--text-main); display: block; margin-bottom: 4px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; transition: color 0.5s;}

        .resume-btn { margin-top: 24px; width: 100%; padding: 14px; background: rgba(26, 188, 156, 0.15); backdrop-filter: blur(10px); color: var(--accent); border: 1px solid var(--accent); border-radius: 16px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .resume-btn:hover { background: var(--accent); color: #fff; transform: translateY(-3px); box-shadow: 0 10px 20px var(--accent-glow); }

        .card-skills { grid-column: span 2; }
        .tag-cloud { display: flex; flex-wrap: wrap; gap: 12px; }
        .tag { padding: 8px 16px; background: rgba(255,255,255,0.05); backdrop-filter: blur(5px); border-radius: 30px; font-size: 0.85rem; color: var(--text-main); border: 1px solid var(--glass-border); transition: all 0.3s; cursor: default; box-shadow: 0 4px 6px rgba(0,0,0,0.1);}
        body.light-mode .tag { background: rgba(0,0,0,0.03); color: var(--text-main); }
        .tag:hover { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }

        .portfolio-links { grid-column: span 4; display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
        .link-card { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 24px; padding: 28px 20px; text-decoration: none; color: inherit; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); transition: all 0.3s; }
        .link-card:hover { border-color: var(--accent); background: rgba(26, 188, 156, 0.1); transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
        .link-card h3 { font-size: 1.15rem; margin-bottom: 6px; transition: transform 0.3s, color 0.5s; color: var(--text-main); white-space: nowrap;}
        .link-card:hover h3 { transform: translateX(8px); color: var(--accent); }
        .link-card p { color: var(--text-muted); font-size: 0.8rem; transition: color 0.5s; white-space: nowrap;}
        .link-card .arrow { font-size: 1.3rem; opacity: 0.5; transition: all 0.3s; color: var(--text-main);}
        .link-card:hover .arrow { opacity: 1; transform: translateX(5px); color: var(--accent); }

        .card-timeline { grid-column: span 4; }
        .timeline-item { border-left: 2px solid rgba(255,255,255,0.2); padding-left: 32px; margin-bottom: 40px; position: relative; transition: border-color 0.5s;}
        body.light-mode .timeline-item { border-left-color: rgba(0,0,0,0.1); }
        .timeline-item:last-child { margin-bottom: 0; border-left-color: transparent; }
        .timeline-item::before { content: ''; position: absolute; left: -7px; top: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        .tl-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 12px; }
        .tl-title { font-size: 1.2rem; font-weight: 600; color: var(--text-main); transition: color 0.5s;}
        .tl-role { color: var(--accent); margin-left: 10px; font-size: 1rem; transition: color 0.5s;}
        .tl-date { color: var(--text-main); opacity: 0.7; font-size: 0.9rem; font-family: monospace; transition: color 0.5s;}
        .tl-body { color: var(--text-muted); font-size: 0.95rem; line-height: 1.8; transition: color 0.5s;}

        footer { text-align: center; padding: 40px; color: var(--text-muted); font-size: 0.9rem; margin-top: 80px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        body.light-mode footer { text-shadow: none; }

        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 10000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; overflow: auto; touch-action: pinch-zoom pan-y pan-x;}
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox img { max-width: 100vw; max-height: 100vh; border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: scale(0.95); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); object-fit: contain; }
        .lightbox.active img { transform: scale(1); }
        .lightbox-close { position: fixed; top: 30px; right: 40px; color: rgba(255,255,255,0.6); font-size: 40px; cursor: pointer; transition: color 0.3s; font-weight: 300; z-index: 10001; }
        .lightbox-close:hover { color: #fff; transform: scale(1.1); }

        .theme-toggle-btn { position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; border-radius: 50%; background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); color: var(--text-main); font-size: 1.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--glass-shadow); z-index: 9999; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .theme-toggle-btn:hover { transform: scale(1.1) rotate(15deg); border-color: var(--accent); color: var(--accent); }

        /* ================= ✨ 密码弹窗样式 ================= */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 10001; align-items: center; justify-content: center; }
        .modal-content { background: var(--glass-bg); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); color: var(--text-main); padding: 40px 30px; border-radius: 24px; width: 90%; max-width: 380px; text-align: center; animation: fadeUp 0.3s ease forwards;
