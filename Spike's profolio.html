<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Clarence Ye - 视觉设计师个人作品集。PRTS 罗德岛终端档案。">
    <title>Rhodes Island Terminal // Clarence Ye</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ================= 罗德岛制式终端 核心变量 ================= */
        :root {
            /* 暗夜战术模式 (默认) */
            --ak-bg-main: #0a0a0a; 
            --ak-bg-panel: #141414; 
            --ak-bg-panel-light: #1c1c1c;
            --ak-text-main: #ffffff;
            --ak-text-muted: #7a7a7a;
            --ak-accent-info: #00d8ff; /* 罗德岛科技蓝 */
            --ak-accent-warn: #f5a623; /* 源石警示橙 */
            --ak-border: #2a2a2a;
            --ak-scan-line: rgba(0, 216, 255, 0.03);
            
            --recharge: #00ffaa; 
            --withdraw: #ff3366; 
            --warning: #ffaa00;
        }

        /* 医疗部白昼模式 (覆盖变量) */
        body.light-mode {
            --ak-bg-main: #f0f2f5; 
            --ak-bg-panel: #ffffff; 
            --ak-bg-panel-light: #f8fafc;
            --ak-text-main: #1a1a1b;
            --ak-text-muted: #64748b;
            --ak-accent-info: #0284c7;
            --ak-accent-warn: #ea580c;
            --ak-border: #d1d5db;
        }

        /* ================= 基础重置 ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--ak-bg-main);
            color: var(--ak-text-main);
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            transition: background 0.4s ease, color 0.4s ease;
            counter-reset: card-counter; /* 开启卡片自动编号系统 */
            -webkit-font-smoothing: antialiased;
        }

        /* ================= 背景与全局特效 (扫描线) ================= */
        .video-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -10; background: #000;
        }
        .video-bg video { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) brightness(0.4); opacity: 0.6; }

        .video-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -9; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6));
            pointer-events: none; transition: background 0.4s ease;
        }
        body.light-mode .video-overlay { background: linear-gradient(rgba(240,242,245,0.8), rgba(240,242,245,0.8)); }
        
        /* 战术扫描线网格 */
        body::before {
            content: " "; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(var(--ak-scan-line) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 3px 100%;
            z-index: 100; pointer-events: none; opacity: 0.5;
        }

        /* ================= 顶部导航栏 ================= */
        nav { 
            position: fixed; top: 0; width: 100%; padding: 15px 5vw; 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--ak-bg-panel); border-bottom: 2px solid var(--ak-border); 
            z-index: 1000; backdrop-filter: blur(10px); transition: background 0.4s, border-color 0.4s;
        }
        .nav-logo { font-weight: 800; font-family: 'Space Mono', monospace; letter-spacing: 2px; color: var(--ak-text-main); text-decoration: none; border: 1px solid var(--ak-accent-info); padding: 6px 14px; font-size: 1.1rem; }
        .nav-right { display: flex; align-items: center; gap: 30px; }
        .nav-links { display: flex; gap: 25px; align-items: center; font-family: 'Space Mono', monospace; font-size: 0.85rem;}
        .nav-links a { color: var(--ak-text-main); text-decoration: none; transition: 0.3s; font-weight: 700; text-transform: uppercase;}
        .nav-links a:hover, .nav-links a.active { color: var(--ak-accent-info); text-shadow: 0 0 8px var(--ak-accent-info); }
        .nav-secret { color: var(--ak-accent-warn); cursor: pointer; border: 1px solid var(--ak-accent-warn); padding: 5px 12px; font-size: 0.85rem; font-family: 'Space Mono', monospace; font-weight: 700; transition: 0.3s; }
        .nav-secret:hover { background: var(--ak-accent-warn); color: var(--ak-bg-main); }

        /* ================= Bento Card 工业战术风 ================= */
        .container { max-width: 1200px; margin: 100px auto 40px; padding: 0 5vw; }
        .bento-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

        .bento-card { 
            background: var(--ak-bg-panel); border: 1px solid var(--ak-border); border-top: 3px solid var(--ak-border);
            padding: 32px; position: relative; opacity: 0; 
            animation: fadeUpAK 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s, box-shadow 0.3s, background 0.4s;
        }
        /* 自动编号 [OP-0X] */
        .bento-card::after {
            counter-increment: card-counter; content: "[OP-0" counter(card-counter) "]";
            position: absolute; top: 10px; left: 12px; font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--ak-text-muted); font-weight: bold;
        }
        .bento-card:hover { border-color: var(--ak-accent-info); transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        body.light-mode .bento-card:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.1); }

        /* 统一入场动画 (无 blur，彻底解决白屏) */
        @keyframes fadeUpAK { 
            from { opacity: 0; transform: translateY(25px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* --- 英雄卡片 --- */
        .card-hero { grid-column: span 2; grid-row: span 2; text-align: center; border-color: var(--ak-accent-info); display: flex; flex-direction: column; justify-content: center; align-items: center;}
        .hero-avatar { width: 140px; height: 140px; border: 2px solid var(--ak-accent-info); padding: 4px; margin-bottom: 20px; object-fit: cover; transition: 0.4s;}
        .hero-avatar:hover { transform: scale(1.05) rotate(3deg); border-color: var(--ak-accent-warn); }
        .elite-tag { background: var(--ak-accent-warn); color: #000; font-size: 11px; font-weight: 800; padding: 3px 8px; display: inline-block; transform: rotate(-3deg); margin-bottom: 12px; font-family: 'Space Mono', monospace; letter-spacing: 1px;}
        .hero-title { font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 12px; text-transform: uppercase;}
        .hero-subtitle { font-family: 'Space Mono', monospace; color: var(--ak-text-muted); font-size: 0.95rem; min-height: 80px; text-align: left; line-height: 1.8;}
        
        .cursor { display: inline-block; width: 8px; height: 1.2em; background: var(--ak-accent-info); vertical-align: middle; animation: blink 1s step-end infinite; margin-left: 4px;}
        @keyframes blink { 50% { opacity: 0; } }

        /* --- 信息面板 --- */
        .card-info { grid-column: span 2; display: flex; flex-direction: column; justify-content: space-between;}
        .card-title { font-size: 1.1rem; font-weight: 800; font-family: 'Space Mono', monospace; margin-bottom: 20px; color: var(--ak-text-main); display: flex; align-items: center; gap: 10px; text-transform: uppercase;}
        .card-title::before { content: '/>'; color: var(--ak-accent-info); font-weight: bold; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .info-item strong { display: block; font-size: 0.7rem; color: var(--ak-accent-info); text-transform: uppercase; font-family: 'Space Mono', monospace; margin-bottom: 4px;}
        .info-item span { font-family: 'Space Mono', monospace; font-size: 0.9rem; font-weight: 700;}

        /* 呼吸警示按钮 */
        .resume-btn { 
            margin-top: 24px; width: 100%; padding: 14px; background: transparent; border: 1px solid var(--ak-accent-info); 
            color: var(--ak-accent-info); font-family: 'Space Mono', monospace; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; font-weight: 800; letter-spacing: 1px;
            animation: pulse-ak 2.5s infinite;
        }
        .resume-btn:hover { background: var(--ak-accent-info); color: #000; animation: none; transform: translateY(-2px);}
        @keyframes pulse-ak { 0% { box-shadow: 0 0 0 0 rgba(0,216,255,0.3); } 70% { box-shadow: 0 0 0 8px rgba(0,216,255,0); } 100% { box-shadow: 0 0 0 0 rgba(0,216,255,0); } }

        /* --- 技能专精区 --- */
        .card-skills { grid-column: span 2; }
        .tag-cloud { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .tag { background: #000; border: 1px solid var(--ak-border); padding: 6px 14px; font-size: 0.8rem; font-weight: 700; font-family: 'Space Mono', monospace; color: var(--ak-accent-info); transition: 0.2s; cursor: crosshair;}
        .tag:hover { background: var(--ak-accent-info); color: #000; transform: translateY(-2px);}
        body.light-mode .tag { background: #fff; }

        /* --- 业务系统直达 --- */
        .portfolio-links { grid-column: span 4; display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; }
        .link-card { background: var(--ak-bg-panel-light); border: 1px solid var(--ak-border); padding: 24px 20px; text-decoration: none; color: inherit; transition: 0.3s; position: relative; display: flex; flex-direction: column; justify-content: center;}
        .link-card::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 3px; background: var(--ak-accent-info); opacity: 0; transition: 0.3s;}
        .link-card:hover::before { opacity: 1; }
        .link-card:hover { border-color: var(--ak-accent-info); background: var(--ak-bg-main); color: var(--ak-accent-info); transform: translateY(-4px);}
        .link-card h3 { font-family: 'Space Mono', monospace; font-size: 1.05rem; margin-bottom: 6px; font-weight: 800;}
        .link-card p { font-size: 0.7rem; color: var(--ak-text-muted); text-transform: uppercase; font-weight: 700;}

        /* --- 部署履历 (时间轴) --- */
        .card-timeline { grid-column: span 4; }
        .timeline-item { border-left: 2px solid var(--ak-border); padding-left: 24px; margin-bottom: 35px; position: relative; transition: border-color 0.3s;}
        .timeline-item:last-child { margin-bottom: 0; }
        .timeline-item::before { content: ''; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px; background: var(--ak-accent-info); transform: rotate(45deg); box-shadow: 0 0 8px var(--ak-accent-info); }
        .tl-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; margin-bottom: 12px; }
        .tl-title { font-size: 1.1rem; font-weight: 800; color: var(--ak-text-main); }
        .tl-role { color: var(--ak-accent-info); font-family: 'Space Mono', monospace; font-size: 0.9rem; margin-left: 12px; font-weight: 700;}
        .tl-date { color: var(--ak-accent-warn); font-family: 'Space Mono', monospace; font-size: 0.85rem; font-weight: 700; padding: 2px 10px; border: 1px solid var(--ak-border); border-radius: 2px; background: rgba(245,166,35,0.05);}
        .tl-body { font-size: 0.95rem; color: var(--ak-text-muted); margin-top: 10px; line-height: 1.8; }
        .tl-body strong { color: var(--ak-text-main); font-weight: 700;}

        /* ================= 私密账本系统 & 计算器 ================= */
        #privateSection { display: none; padding: 35px; background: var(--ak-bg-panel); border: 2px solid var(--ak-border); border-top: 4px solid var(--ak-accent-warn); margin-top: 20px; animation: fadeUpAK 0.6s ease; }
        .secret-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; border-bottom: 1px solid var(--ak-border); padding-bottom: 20px;}
        .secret-header h2 { font-family: 'Space Mono', monospace; color: var(--ak-accent-warn); font-size: 1.5rem; font-weight: 800;}
        
        .data-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-data { background: transparent; color: var(--ak-text-main); border: 1px solid var(--ak-border); padding: 8px 16px; font-family: 'Space Mono', monospace; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: 0.2s; text-transform: uppercase;}
        .btn-data:hover { border-color: var(--ak-accent-info); color: var(--ak-accent-info); background: rgba(0,216,255,0.05);}
        .btn-close-sec { border-color: var(--withdraw); color: var(--withdraw); }
        .btn-close-sec:hover { background: var(--withdraw); color: #fff; border-color: var(--withdraw);}

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--ak-bg-panel-light); padding: 24px; border: 1px solid var(--ak-border); border-left: 4px solid var(--ak-accent-info); }
        .stat-card h3 { font-size: 0.75rem; color: var(--ak-text-muted); text-transform: uppercase; margin-bottom: 10px; font-family: 'Space Mono', monospace; font-weight: 700;}
        .amount { font-family: 'Space Mono', monospace; font-size: 1.8rem; font-weight: 800; }
        .stat-recharge { border-left-color: var(--recharge); } .stat-recharge .amount { color: var(--recharge); }
        .stat-withdraw { border-left-color: var(--withdraw); } .stat-withdraw .amount { color: var(--withdraw); }
        .stat-balance { border-left-color: var(--ak-accent-warn); } .stat-balance .amount { color: var(--ak-accent-warn); }

        .input-section { background: var(--ak-bg-panel-light); padding: 24px; border: 1px solid var(--ak-border); margin-bottom: 30px; }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; align-items: flex-end; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 0.75rem; font-family: 'Space Mono', monospace; color: var(--ak-accent-info); margin-bottom: 8px; font-weight: 700; text-transform: uppercase;}
        .form-group input, .form-group select { padding: 12px; border: 1px solid var(--ak-border); background: var(--ak-bg-main); color: var(--ak-text-main); font-family: 'Space Mono', monospace; font-size: 0.95rem; outline: none; transition: 0.3s;}
        .form-group input:focus, .form-group select:focus { border-color: var(--ak-accent-info); }
        .btn-add { background: var(--ak-accent-info); color: #000; border: none; padding: 14px; font-family: 'Space Mono', monospace; font-size: 0.95rem; font-weight: 800; cursor: pointer; transition: 0.2s; width: 100%; text-transform: uppercase;}
        .btn-add:hover { background: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.6);}

        .history-section { background: var(--ak-bg-panel-light); border: 1px solid var(--ak-border); overflow-x: auto; }
        .history-header { padding: 16px 24px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--ak-border); display: flex; justify-content: space-between; align-items: center; }
        .btn-clear { background: transparent; color: var(--withdraw); border: 1px dashed var(--withdraw); padding: 6px 12px; cursor: pointer; font-family: 'Space Mono', monospace; font-size: 0.75rem; font-weight: 700; transition: 0.2s;}
        .btn-clear:hover { background: var(--withdraw); color: #fff;}

        .ledger-table { width: 100%; border-collapse: collapse; text-align: left; min-width: 700px; font-family: 'Space Mono', monospace;}
        .ledger-table th, .ledger-table td { padding: 14px 24px; border-bottom: 1px solid var(--ak-border); }
        .ledger-table th { color: var(--ak-accent-info); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; }
        .ledger-table td { font-size: 0.9rem; }
        .ledger-table tr:hover { background: rgba(0,216,255,0.05); }
        body.light-mode .ledger-table tr:hover { background: rgba(0,0,0,0.03); }

        .type-recharge { color: var(--recharge); font-weight: bold;}
        .type-withdraw { color: var(--withdraw); font-weight: bold;}
        .btn-delete { background: transparent; color: var(--withdraw); border: 1px solid var(--withdraw); padding: 4px 10px; cursor: pointer; font-size: 0.75rem; font-family: 'Space Mono', monospace; font-weight: bold; transition: 0.2s;}
        .btn-delete:hover { background: var(--withdraw); color: #fff;}

        /* 计算器终端 */
        .calculator-widget {
            display: none; background: var(--ak-bg-main); border: 1px solid var(--ak-accent-warn); border-radius: 4px;
            padding: 24px; margin-bottom: 30px; width: 100%; max-width: 320px; margin-left: auto; margin-right: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeUpAK 0.3s ease forwards;
        }
        .calc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; color: var(--ak-accent-warn); font-family: 'Space Mono', monospace; font-size: 0.85rem; font-weight: bold;}
        .calc-screen {
            background: #000; border: 1px solid #333; padding: 16px; font-size: 2rem; text-align: right; margin-bottom: 16px;
            color: var(--ak-accent-warn); font-family: 'Space Mono', monospace; overflow-x: auto; white-space: nowrap; font-weight: bold;
        }
        body.light-mode .calc-screen { background: #fff; border-color: var(--ak-border);}
        .calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .calc-btn {
            background: var(--ak-bg-panel-light); color: var(--ak-text-main); border: 1px solid var(--ak-border);
            padding: 16px 0; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.15s; font-family: 'Space Mono', monospace;
        }
        .calc-btn:hover { background: var(--ak-accent-warn); color: #000; border-color: var(--ak-accent-warn);}
        .calc-btn:active { transform: scale(0.95); }
        .calc-btn.operator { color: var(--ak-accent-info); }
        .calc-btn.equal { background: var(--ak-accent-info); color: #000; grid-column: span 2; border-color: var(--ak-accent-info); }
        .calc-btn.equal:hover { filter: brightness(1.2); background: var(--ak-accent-info);}
        .calc-btn.clear { color: var(--withdraw); }

        /* ================= 辅助 UI 与弹窗 ================= */
        footer { text-align: center; padding: 40px; color: var(--ak-text-muted); font-family: 'Space Mono', monospace; font-size: 0.75rem; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;}

        /* 灯箱 */
        .lightbox { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); backdrop-filter: blur(5px); z-index: 3000; display: none; justify-content: center; align-items: center; 
        }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90vw; max-height: 90vh; border: 2px solid var(--ak-accent-info); box-shadow: 0 0 40px rgba(0,216,255,0.2); object-fit: contain;}
        .lightbox-close { position: absolute; top: 25px; right: 40px; color: #fff; cursor: pointer; font-family: 'Space Mono', monospace; font-size: 1.2rem; font-weight: bold; border: 1px solid #fff; padding: 6px 12px; transition: 0.3s;}
        .lightbox-close:hover { background: #fff; color: #000; }

        /* 权限验证弹窗 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px);}
        .modal-content { background: var(--ak-bg-main); border: 1px solid var(--ak-accent-warn); padding: 40px 30px; width: 90%; max-width: 380px; text-align: center; position: relative; box-shadow: 0 10px 30px rgba(245,166,35,0.15);}
        .modal-content::before { content: 'RESTRICTED AREA'; position: absolute; top: 10px; left: 10px; font-family: 'Space Mono', monospace; font-size: 0.6rem; color: var(--ak-accent-warn); font-weight: bold; opacity: 0.8;}
        .modal-content h3 { color: var(--ak-accent-warn); font-family: 'Space Mono', monospace; font-size: 1.4rem; font-weight: 800; margin-bottom: 10px;}
        .modal-content input { width: 100%; background: #000; border: 1px solid #333; color: var(--ak-accent-warn); padding: 14px; font-family: 'Space Mono', monospace; text-align: center; letter-spacing: 5px; outline: none; margin: 20px 0; font-size: 1.1rem; font-weight: bold;}
        .modal-content input:focus { border-color: var(--ak-accent-warn); }
        .btn-confirm { background: var(--ak-accent-warn); color: #000; border: none; padding: 12px; font-weight: 800; cursor: pointer; width: 100%; font-family: 'Space Mono', monospace; font-size: 1rem; transition: 0.2s;}
        .btn-confirm:hover { background: #fff; }
        .btn-cancel { background: transparent; color: var(--ak-text-muted); border: none; margin-top: 15px; cursor: pointer; font-family: 'Space Mono', monospace; font-size: 0.8rem; font-weight: bold;}
        .btn-cancel:hover { color: #fff; }

        /* 主题切换悬浮键 */
        .theme-toggle-btn { position: fixed; bottom: 30px; right: 30px; background: var(--ak-bg-main); color: var(--ak-text-muted); border: 1px solid var(--ak-border); padding: 12px 16px; font-family: 'Space Mono', monospace; font-size: 0.8rem; font-weight: 700; cursor: pointer; z-index: 1500; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5);}
        .theme-toggle-btn:hover { border-color: var(--ak-accent-info); color: var(--ak-accent-info); transform: translateY(-3px);}

        /* ================= 响应式 ================= */
        @media (max-width: 1024px) {
            .bento-grid { grid-template-columns: repeat(2, 1fr); }
            .portfolio-links { grid-column: span 2; }
            .card-timeline { grid-column: span 2; }
        }
        @media (max-width: 768px) {
            .bento-grid { grid-template-columns: 1fr; } 
            .card-hero, .card-info, .card-skills, .portfolio-links, .card-timeline { grid-column: span 1; }
            .portfolio-links { grid-template-columns: 1fr; }
            .nav-links { display: none; }
            .tl-date { float: none; display: block; margin-top: 6px; margin-bottom: 12px; width: fit-content; }
            .dashboard { grid-template-columns: 1fr; }
            .secret-header { flex-direction: column; align-items: flex-start; }
            .data-actions { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
